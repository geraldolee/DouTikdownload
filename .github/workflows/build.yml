name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-create Clean Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.clean.doudownloader doudownloader
          cp -r doudownloader/android ../
          cd ..
          rm -rf temp_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouDownloader-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
